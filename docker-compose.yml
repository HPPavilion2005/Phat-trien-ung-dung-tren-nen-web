services:
  nginx:
    image: nginx:alpine
    container_name: remu_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - nodered
    networks:
      - remu_net

  nodered:
    image: nodered/node-red:latest
    container_name: remu_nodered
    restart: always
    ports:
      - "1880:1880"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./nodered/data:/data
    depends_on:
      - mariadb
    networks:
      - remu_net

  mariadb:
    image: mariadb:10.11
    container_name: remu_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "05012005"
      MYSQL_DATABASE: "Remu2005"
      MYSQL_USER: "remu_25"
      MYSQL_PASSWORD: "05012005"
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - remu_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: remu_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    depends_on:
      - mariadb
    networks:
      - remu_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: remu_cloudflared
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=eyJhIjoiNzE4Y2Q3NDIxNWIxYTcyNWU1OTM3YTM5OWMzMGMxZTMiLCJ0IjoiMzVkMmNiYmUtODY2OS00MDY4LWJjMDAtZTZhN2JhNmQzZmJjIiwicyI6Ik9UazJZV1V6T1RFdFl6Z3lOeTAwWVdVMUxUa3paRFV0TlRFNE5UUmtZbUl3WkdJMSJ9
    networks:
      - remu_net

networks:
  remu_net:
    driver: bridge

volumes:
  mariadb_data:
