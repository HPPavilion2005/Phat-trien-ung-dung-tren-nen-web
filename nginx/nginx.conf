events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    # ========================================================
    # DOMAIN 1: Website chính - Đăng nhập & API Node-RED
    # ========================================================
    server {
        listen 80;
        server_name remuk235480106063.id.vn localhost;

        location / {
            root /usr/share/nginx/html/site1;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Giữ nguyên vẹn đường dẫn /api/ sang Node-RED (không có dấu / ở cuối)
        location /api/ {
            proxy_pass http://nodered:1880;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Thêm CORS Header
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
    }

    # ========================================================
    # DOMAIN 2: Website Cổng thông tin TNUT (Subdomain độc lập)
    # ========================================================
    server {
        listen 80;
        server_name site2.remuk235480106063.id.vn;

        location / {
            root /usr/share/nginx/html/site2;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
